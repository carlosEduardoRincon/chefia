openapi: 3.0.3
info:
  title: Users API
  version: 1.0.0
  description: API for managing restaurants
  contact:
    name: Carlos Eduardo Rincon Junior
    email: carlos.rincon.junior@aluno.ifsp.edu.br
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080/
    description: Local server
tags:
  - name: Restaurants
    description: Operations related to restaurants
paths:
  /restaurant:
    get:
      tags:
        - Restaurants
      summary: List all restaurants
      operationId: listRestaurants
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 0
            example: 1
        - name: perPage
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 10
            example: 10
      responses:
        "200":
          description: A list of restaurants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedRestaurants"
    post:
      tags:
        - Restaurants
      summary: Create a new restaurant
      operationId: createRestaurant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRestaurant"
      responses:
        "201":
          description: Restaurant created
          headers:
            Location:
              schema:
                type: string
                format: uri
                example: /user/123e4567-e89b-12d3-a456-426614174000
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"
  /restaurant/{restaurantId}:
    get:
      tags:
        - Restaurants
      summary: Get a restaurant by ID
      operationId: getRestaurant
      parameters:
        - name: restaurantId
          in: path
          description: ID of the restaurant to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Restaurant found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"
        "400":
          description: Bad request
        "404":
          description: Restaurant not found
    put:
      tags:
        - Restaurants
      summary: Update a restaurant
      operationId: updateRestaurant
      parameters:
        - name: restaurantId
          in: path
          description: ID of the restaurant to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRestaurant"
      responses:
        "200":
          description: Restaurant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"
        "404":
          description: Restaurant not found
    delete:
      tags:
        - Restaurants
      summary: Delete a restaurant
      operationId: deleteRestaurant
      parameters:
        - name: restaurantId
          in: path
          description: ID of the restaurant to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Restaurant deleted
        "400":
          description: Bad request
components:
  schemas:
    CreateRestaurant:
      required:
        - name
        - businessHours
        - restaurantType
        - userId
      type: object
      properties:
        name:
          type: string
          description: Name of the restaurant
          minLength: 5
          maxLength: 100
          example: Fast Hamburger
        businessHours:
          type: array
          items:
            $ref: "#/components/schemas/CreateBusinessHours"
        restaurantType:
          type: string
          description: Type of restaurant
          enum:
            - JAPANESE
            - FAST_FOOD
            - ARABIAN
            - MEXICAN
            - CHINESE
            - BRAZILIAN
            - VEGETARIAN
            - ITALIAN
          example: BRAZILIAN
        userId:
          type: integer
          format: int64
          description: Id of the user
          maxLength: 10
          example: 15
    UpdateRestaurant:
      required:
        - name
        - businessHours
        - restaurantType
        - active
      type: object
      properties:
        name:
          type: string
          description: Name of the restaurant
          minLength: 5
          maxLength: 100
          example: Fast Hamburger
        businessHours:
          type: array
          items:
            $ref: "#/components/schemas/CreateBusinessHours"
        restaurantType:
          type: string
          description: Type of restaurant
          enum:
            - JAPANESE
            - FAST_FOOD
            - ARABIAN
            - MEXICAN
            - CHINESE
            - BRAZILIAN
            - VEGETARIAN
            - ITALIAN
          example: BRAZILIAN
        active:
          type: boolean
          description: Indicates if the restaurant is active
          example: true
    PaginatedRestaurants:
      type: object
      properties:
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 10
        total:
          type: integer
          format: int64
          example: 100
        items:
          type: array
          items:
            $ref: "#/components/schemas/Restaurant"
    Restaurant:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Id of the restaurant
          maxLength: 10
          example: 15
        name:
          type: string
          description: Name of the restaurant
          minLength: 5
          maxLength: 100
          example: Fast Hamburger
        businessHours:
          type: array
          items:
            $ref: "#/components/schemas/CreateBusinessHours"
        restaurantType:
          type: string
          description: Type of restaurant
          enum:
            - JAPANESE
            - FAST_FOOD
            - ARABIAN
            - MEXICAN
            - CHINESE
            - BRAZILIAN
            - VEGETARIAN
            - ITALIAN
          example: BRAZILIAN
        userId:
          type: integer
          format: int64
          description: Id of the user
          maxLength: 10
          example: 15
        active:
          type: boolean
          description: Indicates if the restaurant is active
          example: true
        createdAt:
          type: string
          format: date-time
          description: Date and time when the restaurant was created
          example: 2025-07-17T21:00:00
        updatedAt:
          type: string
          format: date-time
          description: Date and time when the restaurant was updated
          example: 2025-07-17T21:00:00
    CreateBusinessHours:
      type: object
      properties:
        weekDay:
          type: string
          description: Identify the week-day
          enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
        openingTime:
          type: string
          format: date-time
          description: Date and time when the user was updated
          example: 2025-07-17T21:00:00
        closingTime:
          type: string
          format: date-time
          description: Date and time when the user was updated
          example: 2025-07-17T21:00:00